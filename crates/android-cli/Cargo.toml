[package]
name = "android-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent-native CLI to inspect, control and automate Android devices over ADB."

[[bin]]
name = "android-cli"
path = "src/main.rs"

# Test fixture: a fake adb binary driven by canned replies. Never shipped in
# release artifacts (release workflow builds `--bin android-cli` only).
[[bin]]
name = "fake-adb"
path = "src/bin/fake_adb.rs"

[dependencies]
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
output = { workspace = true }
adb-engine = { workspace = true }
device-manager = { workspace = true }
app-manager = { workspace = true }
ui-engine = { workspace = true }
appium-engine = { workspace = true }
